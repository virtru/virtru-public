name: 🚀 Gateway Deployment & Verification

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Namespace for deployment'
        required: true
        default: 'virtru'
      gateway_hostname:
        description: 'Gateway hostname'
        required: true
        default: 'gateway-development.virtru.com'
      primary_mailing_domain:
        description: 'Primary mailing domain'
        required: true
        default: 'virtru.example.com'
      number_of_licenses:
        description: 'Number of licenses'
        required: true
        default: '10'
      run_verify_only:
        description: 'Run only verification (skip deployment)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'schema.yaml'
      - 'dev.Dockerfile'
      - 'VERSION'

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-version.outputs.tag }}
      deployer_version: ${{ steps.set-version.outputs.deployer_version }}
      registry: ${{ steps.set-version.outputs.registry }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud"
        id: "gcp-auth"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1053957112592/locations/global/workloadIdentityPools/github-actions-oidc-pool/providers/github-actions-oidc-provider'
          service_account: 'github-actions-sa@prj-infra-automation-ktbz.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: 'Set up Cloud SDK'
        id: setup-gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 363.0.0'
          install_components: 'kubectl'

      - name: "Setup Helm"
        uses: azure/setup-helm@v3
        with:
          version: 'v3.11.1'

      - name: "Connect to Dev GKE Cluster"
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: hg-dev-green

      - name: "Set version variables"
        id: set-version
        run: |
          VERSION=$(cat VERSION)
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "deployer_version=$(echo ${VERSION} | cut -d'.' -f 1-2)" >> $GITHUB_OUTPUT
          echo "registry=us-docker.pkg.dev/prj-hosted-gateway-dev-qvec/gateway/gateway" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

  deploy:
    needs: setup
    if: ${{ !inputs.run_verify_only }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      DEPLOYER_VERSION: ${{ needs.setup.outputs.deployer_version }}
      REGISTRY: ${{ needs.setup.outputs.registry }}
      NAMESPACE: ${{ github.event.inputs.namespace }}
      GATEWAY_HOSTNAME: ${{ github.event.inputs.gateway_hostname }}
      PRIMARY_MAILING_DOMAIN: ${{ github.event.inputs.primary_mailing_domain }}
      NUMBER_OF_LICENSES: ${{ github.event.inputs.number_of_licenses }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud"
        id: "gcp-auth"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1053957112592/locations/global/workloadIdentityPools/github-actions-oidc-pool/providers/github-actions-oidc-provider'
          service_account: 'github-actions-sa@prj-infra-automation-ktbz.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 363.0.0'
          install_components: 'kubectl'

      - name: "Docker login to Artifact Registry"
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: "Connect to Dev GKE Cluster"
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: hg-dev-green

      - name: "Update Helm dependencies"
        run: |
          cd chart/gateway
          helm dependency update

      - name: "Check if Application CRD exists"
        run: |
          if kubectl get crd applications.app.k8s.io &>/dev/null; then
            echo "✅ Application CRD already exists"
          else
            echo "⚠️ Attempting to install Application CRD..."
            kubectl apply -f "https://raw.githubusercontent.com/GoogleCloudPlatform/marketplace-k8s-app-tools/master/crd/app-crd.yaml" || echo "⚠️ Could not install CRD, proceeding anyway"
          fi

      - name: "Build deployer image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dev.Dockerfile
          push: true
          build-args: |
            TAG=${{ env.TAG }}
            REGISTRY=${{ env.REGISTRY }}
          tags: ${{ env.REGISTRY }}/deployer:${{ env.DEPLOYER_VERSION }}
          platforms: linux/amd64

      - name: "Create deployment parameters"
        run: |
          cat > deploy_parameters.json << EOF
          {
            "name": "gateway",
            "namespace": "${{ env.NAMESPACE }}",
            "gatewayHostname": "${{ env.GATEWAY_HOSTNAME }}",
            "gatewayApiTokenName": "token",
            "gatewayApiSecret": "mysecret",
            "gatewayFlow": "Outbound - Data Loss Prevention",
            "primaryMailingDomain": "${{ env.PRIMARY_MAILING_DOMAIN }}",
            "amplitudeToken": "fake-token",
            "pricingPlan": "gateway___gmail_encryption__per_user_per_day_",
            "numberOfLicenses": "${{ env.NUMBER_OF_LICENSES }}",
            "reportingSecret": "gs://cloud-marketplace-tools/reporting_secrets/fake_reporting_secret.yaml",
            "cse.appSecrets.hmac.tokenId": "my-hmac-token-id",
            "cse.appSecrets.hmac.tokenSecret": "my-hmac-token-secret",
            "cse.appSecrets.secretKey": "my-cse-secret-key",
            "cse.appSecrets.ssl.certificate": "my-base64-ssl-certificate",
            "cse.appSecrets.ssl.privateKey": "my-base64-ssl-private-key",
            "cse.appConfig.jwksAuthzIssuers": "eyAidmlydHJ1LXRlc3QiOiAiaHR0cDovL2p3dC5kZWZhdWx0LnN2Yy5jbHVzdGVyLmxvY2FsL2p3ay5qc29uIiB9Cg==",
            "cse.appConfig.jwksAuthnIssuers": "eyAidmlydHJ1LXRlc3QiOiAiaHR0cDovL2p3dC5kZWZhdWx0LnN2Yy5jbHVzdGVyLmxvY2FsL2p3ay5qc29uIiB9Cg==",
            "cse.appConfig.jwtAud": "eyJhdXRobiI6InZpcnRydS10ZXN0IiwiYXV0aHoiOiJ2aXJ0cnUtdGVzdCJ9Cg==",
            "cse.appConfig.jwtKaclsUrl": "http://cse.virtru.svc.cluster.local",
            "cse.ingress.host": "cse.virtru.svc.cluster.local"
          }
          EOF

      - name: "Create namespace if needed"
        run: |
          if ! kubectl get namespace ${{ env.NAMESPACE }} > /dev/null 2>&1; then
            kubectl create namespace ${{ env.NAMESPACE }}
          else
            echo "Namespace ${{ env.NAMESPACE }} already exists"
          fi

      - name: "Deploy using Docker directly"
        run: |
          gcloud auth configure-docker --quiet
          
          docker create --name mpdev-tmp gcr.io/cloud-marketplace-tools/k8s/dev
          docker cp mpdev-tmp:/scripts $HOME/marketplace-scripts
          docker rm mpdev-tmp
          
          chmod -R +x $HOME/marketplace-scripts
          
          $HOME/marketplace-scripts/install \
            --deployer="${REGISTRY}/deployer:${DEPLOYER_VERSION}" \
            --parameters="$(cat deploy_parameters.json)"

      - name: "Verify deployment"
        run: |
          if kubectl get application gateway -n ${{ env.NAMESPACE }}; then
            echo "✅ Application 'gateway' created successfully"
            kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=gateway
            kubectl get all -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=gateway
          else
            echo "❌ Application 'gateway' not found in namespace '${{ env.NAMESPACE }}'."
            exit 1
          fi

  verify:
    needs: [setup, deploy]
    if: ${{ always() && (inputs.run_verify_only || needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      DEPLOYER_VERSION: ${{ needs.setup.outputs.deployer_version }}
      REGISTRY: ${{ needs.setup.outputs.registry }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud"
        id: "gcp-auth"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1053957112592/locations/global/workloadIdentityPools/github-actions-oidc-pool/providers/github-actions-oidc-provider'
          service_account: 'github-actions-sa@prj-infra-automation-ktbz.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 363.0.0'
          install_components: 'kubectl'

      - name: "Docker login to Artifact Registry"
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: "Connect to Dev GKE Cluster"
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: hg-dev-green

      - name: "Update Helm dependencies"
        run: |
          cd chart/gateway
          helm dependency update

      - name: "Run verification using Docker directly"
        run: |
          gcloud auth configure-docker --quiet
          
          docker create --name mpdev-tmp gcr.io/cloud-marketplace-tools/k8s/dev
          docker cp mpdev-tmp:/scripts $HOME/marketplace-scripts
          docker rm mpdev-tmp
          
          chmod -R +x $HOME/marketplace-scripts
          
          export MPDEV_VERIFY_TIMEOUT=600
          $HOME/marketplace-scripts/verify \
            --deployer="${REGISTRY}/deployer:${DEPLOYER_VERSION}" \
            --verbose

      - name: "Cleanup verification resources"
        if: always()
        run: |
          kubectl get ns -l app.kubernetes.io/name=apptest -o name | xargs -r kubectl delete --wait=false
