name: 🏷️ Annotate & Mirror Images to GHCR

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  ANNOTATION: com.googleapis.cloudmarketplace.product.service.name=services/gateway.mp-virtru-public.appspot.com
  REGISTRY: gcr.io/virtru-public/gateway

jobs:
  version:
    runs-on: virtru-scale-set-runner
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Read VERSION
        id: read
        run: echo "version=$(< "${GITHUB_WORKSPACE}/VERSION")" >> "$GITHUB_OUTPUT"

  build-deployer:
    needs: version
    runs-on: virtru-scale-set-runner
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: "Build (annotate) and push to GHCR"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.deployer
          push: true
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            DEPLOYER_VERSION=${{ needs.version.outputs.version }}
            GOOGLE_DEPLOYER_VERSION=13.0.3

          tags: ${{ env.REGISTRY }}/gateway/deployer:${{ needs.version.outputs.version }}
          annotations: |
            ${{ env.ANNOTATION }}

  annotate-and-mirror:
    needs: version
    runs-on: virtru-scale-set-runner
    strategy:
      fail-fast: false
      matrix:
        image:
          - gcr.io/cloud-marketplace-tools/metering/ubbagent:0.2.12
          - containers.virtru.com/gateway:v2.76.0
          - containers.virtru.com/cse:5.10.0
          - containers.virtru.com/cks:2.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: "Log in to GHCR"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: "Prepare Dockerfile and destination"
        id: prep
        run: |
          set -euo pipefail

          # Dockerfile that simply re-bases on the source image so the build
          # step can layer the custom annotation onto it.
          echo "FROM ${{ matrix.image }}" > Dockerfile.mirror

          ref="${{ matrix.image }}"

          # Strip an optional @sha256:... digest.
          [[ "${ref}" == *@* ]] && ref="${ref%@*}"

          # A tag exists only if there's a ':' in the final path segment (after
          # the last '/') -- this avoids mistaking a registry port for a tag.
          last_segment="${ref##*/}"
          if [[ "${last_segment}" == *:* ]]; then
            repository="${ref%:*}"
          else
            repository="${ref}"
          fi
          name="${repository##*/}"

          tag="${{ env.REGISTRY }}/${name}:${{ needs.version.outputs.version }}"

          echo "Source:      ${{ matrix.image }}"
          echo "Destination: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: "Build (annotate) and push to GHCR"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.mirror
          push: true
          tags: ${{ steps.prep.outputs.tag }}
          annotations: |
            ${{ env.ANNOTATION }}
            
